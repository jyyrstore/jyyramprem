<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070d"><title>Jyy'R Amprem • App Center</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/uiux-final.css"><style>
.app-center{max-width:760px;margin:auto;padding:24px}.hero{padding:26px;border-radius:28px}.hero h1{margin:4px 0 8px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.meta>div{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.03)}.meta small{display:block;opacity:.65}.release{margin-top:14px}.release-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.release ul{padding-left:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;opacity:.75}.version-box{padding:12px 14px;border-radius:14px;background:rgba(27,225,255,.07);border:1px solid rgba(27,225,255,.16)}@media(max-width:600px){.meta{grid-template-columns:1fr}.app-center{padding:16px}}
</style></head><body><main class="app-shell app-center"><section class="card hero"><div class="eyebrow">APP CENTER</div><h1>Jyy'R Amprem</h1><p class="section-note">Aplikasi Android resmi, update, release notes, dan verifikasi file.</p><div id="latest" class="release"><div class="status info">Memuat release terbaru…</div></div></section><section class="card release"><div class="release-head"><div><h2 class="section-title">Riwayat Release</h2><p class="section-note">Versi stable yang pernah dipublikasikan.</p></div></div><div id="history"><div class="status info">Memuat riwayat…</div></div></section></main><script>
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>{n=Number(n);if(!Number.isFinite(n)||n<=0)return '—';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`};
function releaseCard(r,latest=false){const items=(r.changelog||[]).map(x=>`<li>${esc(x)}</li>`).join('');const href=esc(r.download_url);return `<article class="release"><div class="release-head"><div><div class="eyebrow">${esc(r.release_channel||'stable')}</div><h2>${esc(r.version)} ${latest?'<span class="badge green">TERBARU</span>':''}</h2></div><span class="badge ${r.mandatory_update?'red':'blue'}">${r.mandatory_update?'WAJIB UPDATE':'STABLE'}</span></div><div class="meta"><div><small>Version Code</small><strong>${esc(r.version_code)}</strong></div><div><small>Ukuran</small><strong>${fmt(r.file_size_bytes)}</strong></div><div><small>Rilis</small><strong>${r.published_at?esc(new Date(r.published_at).toLocaleDateString('id-ID',{dateStyle:'medium'})):'—'}</strong></div></div>${items?`<ul>${items}</ul>`:''}<div class="actions"><a class="btn primary" href="${href}" download>Download APK ${esc(r.version)}</a><a class="btn" href="/app.html">App Center</a></div>${r.sha256?`<p class="section-note">SHA-256<br><span class="mono">${esc(r.sha256)}</span></p>`:''}${r.min_supported_version?`<p class="section-note">Minimum supported: ${esc(r.min_supported_version)}</p>`:''}</article>`}
(async()=>{try{const [a,b]=await Promise.all([fetch('/api/app/latest',{cache:'no-store'}).then(r=>r.json()),fetch('/api/app/releases?limit=20',{cache:'no-store'}).then(r=>r.json())]);if(a.ok){$('#latest').innerHTML=releaseCard(a.release,true)}else $('#latest').innerHTML='<div class="status info">Belum ada release terbaru.</div>';$('#history').innerHTML=b.ok&&b.releases.length?b.releases.map(r=>releaseCard(r,false)).join(''):'<div class="status info">Belum ada riwayat release.</div>'}catch(e){$('#latest').innerHTML='<div class="status error">Gagal memuat release.</div>';$('#history').innerHTML='<div class="status error">Gagal memuat riwayat.</div>'}})();
</script></body></html>
