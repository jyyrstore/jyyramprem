<!DOCTYPE html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
  <meta content="#09070d" name="theme-color"/>
  <meta content="yes" name="mobile-web-app-capable"/>
  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
  <link href="/manifest.webmanifest" rel="manifest"/>
  <title>
   Jyy'R Amprem
  </title>
  <link href="/css/common.css" rel="stylesheet"/>
  <link href="/css/uiux-final.css" rel="stylesheet"/>
  <style>
   html,body{margin:0;min-height:100%;background:#08060d;color:#fff;}
    .app-view[hidden]{display:none!important;}
    #app-root{min-height:100vh;}
  </style>
 </head>
 <body>
  <main aria-live="polite" id="app-root">
   <div id="app-loading" class="app-loading" aria-live="polite" aria-busy="true">
  <div class="app-loading-card">
    <div class="app-loading-brand">
      <div class="app-loading-logo-wrap">
        <img
          class="app-loading-logo"
          src="/assets/Icon/Backend-Online.png"
          alt="Jyy'R Amprem"
        />
        <span class="app-loading-ring"></span>
        <span class="app-loading-dot"></span>
      </div>
    </div>

    <div class="app-loading-title">Jyy'R Amprem</div>
    <div class="app-loading-subtitle">Preparing your workspace</div>

    <div class="app-loading-progress" aria-hidden="true">
      <span></span>
    </div>

    <div class="app-loading-status">
      <span class="app-loading-status-dot"></span>
      <span>Initializing secure session</span>
    </div>
  </div>
</div>
   <section class="app-view" data-view="login" hidden="" id="view-login">
    <template>
     <main class="auth-shell">
      <!-- =====================================================
         BRAND
    ====================================================== -->
      <header aria-label="Jyy'r Amprem" class="auth-brand">
       <div class="brand-photo-wrap">
        <img alt="Foto profil Jyy'R Amprem" class="brand-photo" onerror="this.style.visibility='hidden'" src="/assets/Foto/Jyy'R_PROFIL.png"/>
       </div>
       <div aria-label="Jyy'r Amprem" class="brand-wordmark" id="brandWordmark">
       </div>
      </header>
      <!-- =====================================================
         AUTH CARD
    ====================================================== -->
      <section aria-labelledby="modeTitle" class="auth-card">
       <div class="auth-card-inner">
        <!-- Heading -->
        <div class="auth-heading">
         <h1 id="modeTitle">
          Masuk
         </h1>
         <p class="sr-only" id="modeDescription">
          Masuk untuk mengakses portal.
         </p>
        </div>
        <!-- =================================================
             AUTH FORM
        ================================================== -->
        <form class="auth-form" id="authForm" novalidate="">
         <!-- Username -->
         <div class="field hidden" id="usernameField">
          <input aria-required="true" autocomplete="username" class="input" id="username" maxlength="32" placeholder="Username" required="" type="text"/>
          <span aria-hidden="true" class="field-icon">
           <img alt="" src="/assets/Icon/Login-User.png"/>
          </span>
          <span class="sr-only" id="registerCodeHelp">
           Masukkan tepat 6 digit yang dikirim ke email Anda.
          </span>
         </div>
         <!-- Email -->
         <div class="field auth-email-field" id="emailField">
          <label class="sr-only" for="email" id="emailLabel">
           Username / Email
          </label>
          <input autocomplete="email" class="input" id="email" placeholder="Username/Email" required="" type="email"/>
          <span aria-hidden="true" class="field-icon">
           <img alt="" src="/assets/Icon/e-mail.png"/>
          </span>
         </div>
         <!-- Password -->
         <div class="field auth-password-field">
          <label class="sr-only" for="password">
           Password
          </label>
          <div class="password-row">
           <input autocomplete="current-password" class="input" id="password" minlength="8" placeholder="Password..." required="" type="password"/>
           <button aria-label="Lihat password" class="icon-btn" id="togglePassword" type="button">
            <img alt="" src="/assets/Icon/tutup-sandi.png"/>
           </button>
          </div>
         </div>
         <!-- Register Code -->
         <div class="field hidden" id="registerCodeField">
          <label class="sr-only" for="code">
           Kode verifikasi 6 digit
          </label>
          <input aria-describedby="registerCodeHelp" autocomplete="one-time-code" class="input" id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6 digit code" type="text"/>
          <span aria-hidden="true" class="field-icon">
           <img alt="" src="/assets/Icon/Verifikasi.png"/>
          </span>
         </div>
         <!-- Authentication Links -->
         <div class="auth-links">
          <button id="forgotPassword" type="button">
           Lupa Password?
          </button>
          <button class="hidden" id="resendCode" type="button">
           Kirim ulang code
          </button>
         </div>
         <!-- Login -->
         <button class="auth-action auth-login" id="submitBtn" type="submit">
          LOGIN
         </button>
         <!-- Register -->
         <button class="auth-action auth-register-tab" id="registerTab" type="button">
          DAFTAR
         </button>
        </form>
       </div>
      </section>
      <!-- =====================================================
         COPYRIGHT
    ====================================================== -->
      <p class="copyright">
       © 2026 Jyy'R Amprem. All Rights Reserved
      </p>
     </main>
     <div aria-hidden="true" class="token-gate" hidden="" id="tokenGate">
      <div class="token-backdrop">
      </div>
      <section aria-labelledby="tokenGateTitle" aria-modal="true" class="token-modal" role="dialog">
       <button aria-label="Tutup" class="token-close" id="tokenGateClose" title="Tutup" type="button">
        ×
       </button>
       <div class="token-kicker">
        PORTAL SECURITY
       </div>
       <h2 id="tokenGateTitle">
        Masukkan Token
       </h2>
       <p class="token-description">
        Akun sudah berhasil diverifikasi. Masukkan Token Akses Portal untuk melanjutkan.
       </p>
       <div class="field token-field">
        <label for="portalTokenInput">
         Token Akses
        </label>
        <input autocapitalize="characters" autocomplete="one-time-code" class="input" id="portalTokenInput" inputmode="text" maxlength="20" placeholder="20 karakter token" spellcheck="false" type="text"/>
       </div>
       <div aria-live="polite" class="token-status" id="portalTokenStatus">
       </div>
       <div class="token-actions">
        <button class="btn primary full" id="verifyPortalTokenBtn" type="button">
         VERIFIKASI TOKEN
        </button>
        <button class="btn full" id="getPortalTokenBtn" type="button">
         GET TOKEN
        </button>
       </div>
       <p class="token-hint">
        GET TOKEN membuka kontak WhatsApp Owner untuk mendapatkan Token Akses Portal.
       </p>
      </section>
     </div>
    </template>
   </section>
   <section class="app-view" data-view="home" hidden="" id="view-home">
    <template>
     <main class="app-shell">
      <!-- =====================================================
       TOPBAR
  ====================================================== -->
      <header class="topbar">
       <button aria-label="Status backend" aria-live="polite" class="backend-pill" id="backendPill" title="Backend sedang diperiksa" type="button">
        <img alt="" aria-hidden="true" class="backend-icon" id="backendIcon" src="/assets/Icon/Backend-Online.png"/>
        <span class="backend-label" id="backendLabel">
         Backend On
        </span>
       </button>
       <div class="top-actions">
        <button aria-controls="accountPopup" aria-expanded="false" aria-label="Buka menu akun" class="round-btn" id="settingsBtn" type="button">
         <span id="settingsIcon">
         </span>
        </button>
       </div>
      </header>
      <!-- =====================================================
       HERO
  ====================================================== -->
      <section class="hero-banner">
       <div class="hero-art-frame">
        <video autoplay="" class="video-banner" id="brandBanner" loop="" muted="" playsinline="" preload="auto" src="/assets/Video/jyybanner.mp4">
        </video>
       </div>
       <div class="brand-under-banner">
        <img alt="Jyy'R Amprem" data-brand-logo=""/>
        <div aria-label="Jyyr Amprem" class="hero-nickname" id="heroNickname">
        </div>
       </div>
      </section>
      <!-- =====================================================
       GENERATOR / MAGIC LINK FLOW
  ====================================================== -->
      <section class="card generator-card">
       <div class="section-head">
        <div class="generator-heading">
         <div class="eyebrow">
          AMP PREMIUM
         </div>
         <h2 class="section-title">
          Generate / Activate
         </h2>
        </div>
        <span class="badge blue generator-health">
         <span class="health-dot">
         </span>
         <span id="healthStatus">
          Checking
         </span>
        </span>
       </div>
       <div class="generator-intro">
        <span aria-hidden="true" class="generator-intro-icon">
         ✦
        </span>
        <span>
         Masukkan email aktif untuk magic link.
        </span>
       </div>
       <div class="field generator-email-field">
        <label for="email">
         Email aktif
        </label>
        <input autocomplete="email" class="input" id="email" inputmode="email" maxlength="254" placeholder="Jyy'R@gmail.com" required="" type="email"/>
       </div>
       <div aria-label="Progress generate" aria-live="polite" class="generate-energy hidden" id="generateEnergy">
        <div class="energy-head">
         <strong>
          GENERATING
         </strong>
         <span id="energyPercent">
          0%
         </span>
        </div>
        <div class="energy-track">
         <div id="energyProgress">
         </div>
        </div>
        <div class="energy-foot">
         <span id="energyIcon">
         </span>
         <span id="energyLabel">
          POWERING UP
         </span>
        </div>
       </div>
       <div class="generator-action">
        <button class="btn primary full" id="generateBtn" type="button">
         <span id="packageIcon">
         </span>
         <span>
          Generate Email
         </span>
        </button>
        <button class="btn verification-reopen hidden" id="reopenVerificationBtn" type="button">
         <span id="resultReopenIcon">
         </span>
         <span>
          Lihat Verifikasi
         </span>
        </button>
       </div>
       <div aria-live="polite" class="status flow-status-sr" id="status">
       </div>
       <div aria-hidden="true" aria-labelledby="flowTitle" aria-modal="true" class="result-card hidden" id="result" role="dialog">
        <div class="result-top">
         <div class="result-heading">
          <div class="result-kicker">
           <span aria-hidden="true" class="result-kicker-icon">
            ✉
           </span>
           <span>
            VERIFIKASI
           </span>
          </div>
          <span class="badge blue" id="flowBadge">
           Menunggu
          </span>
          <h3 id="flowTitle">
           Cek inbox
          </h3>
          <p>
           Ambil link terbaru dari inbox, lalu tempel di sini.
          </p>
         </div>
         <div class="result-actions">
          <button class="btn result-copy" id="copyAll" type="button">
           <span id="copyIcon">
           </span>
           Salin
          </button>
          <button aria-label="Tutup verifikasi" class="icon-btn verification-close" id="closeVerificationBtn" type="button">
           <span id="resultCloseIcon">
           </span>
          </button>
         </div>
        </div>
        <div class="result-lines" id="resultText">
        </div>
        <div class="field hidden magic-step" id="magicLinkStep">
         <label for="rawMagicLinkInput">
          Tempel magic link
         </label>
         <textarea autocomplete="off" class="input" id="rawMagicLinkInput" placeholder="Tempel link dari email terbaru di sini" rows="4" spellcheck="false"></textarea>
         <small class="section-note" id="deliveryStatusNote">
          Cek Inbox atau Spam, lalu gunakan link paling baru.
         </small>
         <div class="magic-actions">
          <button class="btn" id="resendMagicLinkBtn" type="button">
           Kirim Ulang
          </button>
          <button class="btn primary" id="verifyBtn" type="button">
           Verifikasi &amp; Aktifkan
          </button>
         </div>
        </div>
        <div class="hidden" id="activationStep" style="margin-top:12px">
         <div class="status success" id="verificationStatus">
          Magic link terverifikasi.
         </div>
         <button class="btn primary full" id="applyPremiumBtn" type="button">
          Generate / Activate
         </button>
        </div>
       </div>
      </section>
      <!-- =====================================================
       QUOTA + SECURITY
  ====================================================== -->
      <section class="grid grid-2 generate-secondary-grid">
       <!-- QUOTA -->
       <article class="card">
        <div class="section-head">
         <div>
          <h2 class="section-title">
           Quota
          </h2>
          <p class="section-note">
           Batas generate mailbox yang tersedia hari ini.
          </p>
         </div>
         <span class="badge blue" id="quotaStatus">
          Memuat
         </span>
        </div>
        <div class="grid grid-3 quota-mini">
         <div class="metric">
          <span class="metric-label">
           USED
          </span>
          <strong class="metric-value" id="quotaUsed">
           -
          </strong>
         </div>
         <div class="metric">
          <span class="metric-label">
           DAILY LIMIT
          </span>
          <strong class="metric-value" id="quotaLimit">
           -
          </strong>
         </div>
         <div class="metric">
          <span class="metric-label">
           REMAINING
          </span>
          <strong class="metric-value" id="quotaRemaining">
           -
          </strong>
         </div>
        </div>
        <div aria-hidden="true" class="quota-progress">
         <div id="quotaProgress">
         </div>
        </div>
        <div class="quota-footnote">
         <span>
          Reset setiap hari
         </span>
         <span id="quotaUsageLabel">
          0 dari 5 digunakan
         </span>
        </div>
       </article>
       <!-- SECURITY -->
       <article class="card security-card">
        <div class="section-head">
         <div>
          <div class="eyebrow">
           PROTECTION
          </div>
          <h2 class="section-title">
           Security
          </h2>
          <p class="section-note">
           Perlindungan server dan penggunaan akun aktif.
          </p>
         </div>
         <div class="security-status">
          <span class="security-status-dot">
          </span>
          <span>
           Protected
          </span>
         </div>
        </div>
        <ul aria-label="Perlindungan keamanan" class="checks">
         <li>
          <span id="check1">
          </span>
          <span class="security-copy">
           <strong>
            Provider credentials aman
           </strong>
           <small>
            API key dan secret hanya diproses di server.
           </small>
          </span>
         </li>
         <li>
          <span id="check2">
          </span>
          <span class="security-copy">
           <strong>
            Rate limit aktif
           </strong>
           <small>
            Permintaan generate dibatasi untuk mencegah penyalahgunaan.
           </small>
          </span>
         </li>
         <li>
          <span id="check3">
          </span>
          <span class="security-copy">
           <strong>
            Quota harian aktif
           </strong>
           <small>
            Penggunaan mengikuti batas harian akun.
           </small>
          </span>
         </li>
        </ul>
       </article>
      </section>
      <!-- =====================================================
       PREMIUM BENEFITS
  ====================================================== -->
      <section class="card benefits">
       <div class="benefits-brand">
        <img alt="Jyy'R Amprem" data-brand-logo=""/>
        <div>
         <div class="eyebrow">
          JYY'R PREMIUM
         </div>
         <h2 class="section-title">

         </h2>
         <p class="section-note">

       </div>

        <div class="benefit-item">

        </div>

        </div>
        <div class="benefit-item">

        </div>
        <div class="benefit-item">

         </span>

        </div>
        <div class="benefit-item">
         <span class="benefit-icon" id="giftIcon2">
         </span>

         </span>
        </div>
        <div class="benefit-item">
         <span class="benefit-icon" id="packageIcon2">
         </span>
         <span>
          Premium Presets &amp; Assets
         </span>
        </div>
        <div class="benefit-item">
         <span class="benefit-icon" id="arrowIcon">
         </span>
         <span>

         </span>
        </div>
        <div class="benefit-item">
         <span class="benefit-icon" id="colorIcon">
         </span>
         <span>

        </div>
        <div class="benefit-item">
         <span class="benefit-icon" id="refreshIcon">
         </span>
         <span>

        </div>
       </div>
       <p class="benefit-note">
        Ketersediaan fitur dapat berbeda sesuai versi aplikasi dan status Premium.
       </p>
      </section>
      <!-- =====================================================
       HOW IT WORKS
  ====================================================== -->
      <section aria-labelledby="stepsTitle" class="card steps steps-modern">
       <div class="section-head steps-head">
        <div>
         <div class="eyebrow">
          HOW IT WORKS
         </div>
         <h2 class="section-title" id="stepsTitle">
          <span aria-hidden="true" class="section-mark section-title-mark">
           <span id="stepsIcon">
           </span>
          </span>
          Cara kerja
         </h2>
         <p class="section-note">
          Tiga langkah singkat untuk mendapatkan akses Premium.
         </p>
        </div>
       </div>
       <div class="steps-list">
        <div class="step-row">
         <span class="step-icon">
          <span id="stepEmailIcon">
          </span>
         </span>
         <div class="step-copy">
          <span class="step-kicker">
           01
          </span>
          <h3>
           Masukkan email
          </h3>
          <p>
           Gunakan email aktif yang dapat menerima magic link.
          </p>
         </div>
        </div>
        <div class="step-row">
         <span class="step-icon">
          <span id="stepLinkIcon">
          </span>
         </span>
         <div class="step-copy">
          <span class="step-kicker">
           02
          </span>
          <h3>
           Ambil magic link
          </h3>
          <p>
           Buka inbox, salin link terbaru, lalu tempelkan ke portal.
          </p>
         </div>
        </div>
        <div class="step-row">
         <span class="step-icon">
          <span id="stepVerifyIcon">
          </span>
         </span>
         <div class="step-copy">
          <span class="step-kicker">
           03
          </span>
          <h3>
           Verifikasi &amp; aktifkan
          </h3>
          <p>
           Portal memverifikasi link dan menyelesaikan aktivasi Premium.
          </p>
         </div>
        </div>
       </div>
      </section>
      <!-- =====================================================
       BACKEND SECURITY
  ====================================================== -->
      <section aria-labelledby="backendSecurityTitle" class="card backend-security-card">
       <div class="section-head">
        <div>
         <div class="eyebrow">
          INFRASTRUCTURE
         </div>
         <h2 class="section-title" id="backendSecurityTitle">
          <span aria-hidden="true" class="section-mark section-title-mark">
           <span id="lockIcon">
           </span>
          </span>
          Backend terlindungi
         </h2>
         <p class="section-note">
          Proses sensitif tetap berada di sisi server.
         </p>
        </div>
       </div>
       <div class="backend-points">
        <div class="backend-point">
         <span class="backend-point-icon">
          <span id="backendShieldIcon">
          </span>
         </span>
         <div>
          <strong>
           Kredensial provider tetap privat
          </strong>
          <small>
           API key tidak dikirim atau disimpan di browser.
          </small>
         </div>
        </div>
        <div class="backend-point">
         <span class="backend-point-icon">
          <span id="backendServerIcon">
          </span>
         </span>
         <div>
          <strong>
           Generate diproses di server
          </strong>
          <small>
           Permintaan diteruskan melalui backend yang terlindungi.
          </small>
         </div>
        </div>
       </div>
      </section>
      <!-- =====================================================
       SOCIAL
  ====================================================== -->
      <section aria-labelledby="socialTitle" class="card social-card">
       <div class="section-head">
        <div>
         <div class="eyebrow">
          CONNECT
         </div>
         <h2 class="section-title" id="socialTitle">
          <span aria-hidden="true" class="section-mark section-title-mark">
           <span id="socialIcon">
           </span>
          </span>
          Social &amp; Community
         </h2>
         <p class="section-note">
          Temukan update, bantuan, dan informasi terbaru.
         </p>
        </div>
       </div>
       <div class="socials" id="socialLinks">
       </div>
      </section>
      <!-- =====================================================
       FOOTER LINKS
  ====================================================== -->
      <section aria-labelledby="footerLinksTitle" class="card footer-links">
       <div class="section-head footer-links-head">
        <div>
         <div class="eyebrow">
          QUICK ACCESS
         </div>
         <h2 class="section-title" id="footerLinksTitle">
          <span aria-hidden="true" class="section-mark section-title-mark">
           <span id="footerLinkIcon">
           </span>
          </span>
          Pusat informasi
         </h2>
         <p class="section-note">
          Panduan dan informasi penting dalam satu tempat.
         </p>
        </div>
       </div>
       <div class="link-columns">
        <div class="link-group">
         <h3>

         </h3>
         <a data-jyyr-section="generate" data-jyyr-view="help" href="/">

           <span id="guideIcon">
           </span>
          </span>
          <span>
           Cara Generate Account
          </span>
         </a>
         <a data-jyyr-section="access" data-jyyr-view="help" href="/">
          <span class="link-icon">
           <span id="accessIcon">
           </span>
          </span>
          <span>
           Cara Access
          </span>
         </a>
         <a data-jyyr-section="faq" data-jyyr-view="help" href="/">
          <span class="link-icon">
           <span id="faqIcon">
           </span>
          </span>
          <span>
           FAQ
          </span>
         </a>
        </div>
        <div class="link-group">
         <h3>
          Dukungan
         </h3>
         <a data-jyyr-focus="support" data-jyyr-view="dashboard" href="/">
          <span class="link-icon">
           <span id="reportIcon">
           </span>
          </span>
          <span>
           Lapor Masalah
          </span>
         </a>
         <a href="https://sociabuzz.com/ajirhs/tribe" id="donateAction" rel="noopener" target="_blank">
          <span class="link-icon">
           <span id="donateIcon">
           </span>
          </span>
          <span>
           Donate
          </span>
         </a>
        </div>
