<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09070d">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Jyy'R Amprem</title>

  <link rel="manifest" href="/manifest.webmanifest">

  <style>
    @font-face {
      font-family: JyyRBrand;
      src: url('/assets/Font/jyyramprem.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --cyan: #1be1ff;
      --violet: #9f64ff;
      --pink: #ff55cf;
      --text: #f7f2ff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;

      background:
        radial-gradient(
          62% 48% at 18% 20%,
          rgba(27, 225, 255, 0.19),
          transparent 70%
        ),
        radial-gradient(
          58% 48% at 82% 22%,
          rgba(159, 100, 255, 0.19),
          transparent 70%
        ),
        radial-gradient(
          70% 56% at 50% 100%,
          rgba(255, 85, 207, 0.12),
          transparent 70%
        ),
        linear-gradient(
          160deg,
          #07070a 0%,
          #0c0a13 48%,
          #07070a 100%
        );

      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;

      width: 54vw;
      height: 54vw;
      max-width: 520px;
      max-height: 520px;

      border-radius: 50%;
      filter: blur(42px);
      opacity: 0.42;

      pointer-events: none;

      animation: drift 8s ease-in-out infinite alternate;
    }

    body::before {
      background: rgba(27, 225, 255, 0.15);
      left: -18vw;
      top: 4vh;
    }

    body::after {
      background: rgba(255, 85, 207, 0.13);
      right: -18vw;
      bottom: 2vh;
      animation-delay: -2.5s;
    }

    .intro {
      position: relative;
      z-index: 1;

      width: min(88vw, 390px);
      min-height: 82svh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 24px;
      padding: 34px 22px;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 34px;

      background:
        linear-gradient(
          180deg,
          rgba(25, 22, 34, 0.78),
          rgba(10, 9, 14, 0.92)
        );

      backdrop-filter: blur(28px);

      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.46),
        0 0 40px rgba(120, 90, 255, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      text-align: center;
    }

    .ring {
      width: 154px;
      height: 154px;
      padding: 7px;

      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          var(--cyan),
          var(--violet),
          var(--pink),
          var(--cyan)
        );

      box-shadow:
        0 0 36px rgba(27, 225, 255, 0.24),
        0 0 58px rgba(159, 100, 255, 0.17);

      animation: pulse 2.8s ease-in-out infinite;
    }

    .photo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      border-radius: 50%;

      border: 4px solid rgba(7, 7, 10, 0.88);
      background: #16131d;
    }

    .eyebrow {
      margin-top: 8px;

      letter-spacing: 0.22em;
      font-size: 10px;
      font-weight: 800;

      color: #9aa1b7;
      text-transform: uppercase;
    }

    .name {
      margin: 0;

      font-family:
        JyyRBrand,
        system-ui,
        sans-serif;

      font-size: clamp(35px, 10vw, 54px);
      line-height: 0.96;
      letter-spacing: 0.02em;

      background:
        linear-gradient(
          100deg,
          var(--cyan) 0%,
          #62b9ff 29%,
          var(--violet) 62%,
          var(--pink) 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(
          0 0 18px rgba(125, 108, 255, 0.18)
        );
    }

    .tag {
      margin: 0;
      max-width: 270px;

      color: #aaa6b4;
      font-size: 12px;
      line-height: 1.6;
    }

    .loader {
      display: flex;
      align-items: center;

      gap: 8px;
      margin-top: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 13px rgba(27, 225, 255, 0.8);

      animation: blink 1.1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.18s;
      background: var(--violet);
    }

    .dot:nth-child(3) {
      animation-delay: 0.36s;
      background: var(--pink);
    }

    @keyframes pulse {
      50% {
        transform: scale(1.018);

        box-shadow:
          0 0 44px rgba(27, 225, 255, 0.28),
          0 0 70px rgba(159, 100, 255, 0.22);
      }
    }

    @keyframes blink {
      50% {
        transform: translateY(-3px);
        opacity: 0.45;
      }
    }

    @keyframes drift {
      to {
        transform:
          translate3d(4vw, -3vh, 0)
          scale(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main
    class="intro"
    aria-label="Jyy'R Amprem"
  >
    <div class="ring">
      <img
        class="photo"
        src="/assets/Foto/app_icon.png"
        alt="Icon Jyy'R Amprem"
      >
    </div>

    <div>
      <div class="eyebrow">
        WELCOME TO
      </div>

      <h1 class="name">
        Jyy'R Amprem
      </h1>
    </div>

    <p class="tag">
      Premium Account Portal
    </p>

    <div
      class="loader"
      aria-label="Memuat aplikasi"
    >
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </main>

  <script>
    const next = () => {
      try {
        const raw = localStorage.getItem(
          'am_account_portal_session'
        );

        const s = raw
          ? JSON.parse(raw)
          : null;

        location.replace(
          s?.access_token
            ? '/home.html'
            : '/login.html'
        );
      } catch {
        location.replace('/login.html');
      }
    };

    setTimeout(next, 1700);
  </script>
</body>
</html>
